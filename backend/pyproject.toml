[project]
name = "red-room-backend"
version = "0.1.0"
description = "Red Room backend: FastAPI agent engine, sandbox tools, scoring and versions"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic>=2",
    "mistralai",
    "supabase",
    "networkx",
    "httpx",
    "python-dotenv",
    "sqlmodel",
    "pytest",
    "pytest-asyncio",
    "psycopg[binary]>=3.3.9",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
